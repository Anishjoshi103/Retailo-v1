name: retailo

services:
  db:
    image: ${SQLSERVER_IMAGE:?Set SQLSERVER_IMAGE to a SQL Server Express image pinned by sha256 digest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the protected production .env}
      MSSQL_MEMORY_LIMIT_MB: ${SQLSERVER_MEMORY_LIMIT_MB:-2048}
    volumes:
      - retailo_sqlserver_data:/var/opt/mssql
      - ./var/backups/sqlserver:/var/opt/mssql/backup
    networks:
      - data
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SET NOCOUNT ON; SELECT 1\" -b -o /dev/null"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${SQLSERVER_CPU_LIMIT:-2.0}"
          memory: ${SQLSERVER_MEMORY_LIMIT:-3G}

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to a Redis image pinned by sha256 digest}
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--maxmemory", "${REDIS_MAXMEMORY:-128mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - retailo_redis_data:/data
    networks:
      - data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.50}"
          memory: ${REDIS_MEMORY_LIMIT:-256M}

  api:
    image: ${API_IMAGE:?Set API_IMAGE to the published Retailo API image pinned by sha256 digest}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.prod}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env.prod}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS in .env.prod}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      AUTH_REFRESH_COOKIE_SAMESITE: ${AUTH_REFRESH_COOKIE_SAMESITE:-Lax}
      THROTTLE_CACHE_KEY_PREFIX: ${THROTTLE_CACHE_KEY_PREFIX:-retailo:throttle}
      DATABASE_ENGINE: mssql
      DATABASE_HOST: db
      DATABASE_PORT: "1433"
      DATABASE_NAME: ${DATABASE_NAME:-Retailo}
      DATABASE_USER: sa
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXY_COUNT: "1"
      TRUST_PROXY_SSL_HEADER: "true"
      SECURE_SSL_REDIRECT: "true"
      # SQL Server container uses its generated certificate on the private Docker data network.
      DATABASE_EXTRA_PARAMS: "TrustServerCertificate=yes"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import Request, urlopen; urlopen(Request('http://127.0.0.1:8000/api/v1/ready', headers={'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-2.0}"
          memory: ${API_MEMORY_LIMIT:-1G}

  proxy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a Caddy image pinned by sha256 digest}
    environment:
      RETAILO_HOSTNAME: ${RETAILO_HOSTNAME:-retailo.lan}
    ports:
      - "${LAN_BIND_IP:?Set LAN_BIND_IP to the store server's LAN IPv4 address}:443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - retailo_caddy_data:/data
      - retailo_caddy_config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header='Host: ${RETAILO_HOSTNAME:-retailo.lan}' -O /dev/null --no-check-certificate https://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${PROXY_CPU_LIMIT:-0.50}"
          memory: ${PROXY_MEMORY_LIMIT:-256M}

networks:
  edge:
    # API needs outbound access for configured email delivery; only Caddy publishes a LAN-bound port.
  data:
    internal: true

volumes:
  retailo_sqlserver_data:
  retailo_redis_data:
  retailo_caddy_data:
  retailo_caddy_config:
