@if(loading()){<p role="status">Loading…</p>}@else if(error()){<p role="alert">{{error()}}</p>}@else if(!rows().length){<p class="rt-table-empty">No records found.</p>}@else{<div class="rt-table-scroll"><table><thead><tr>@for(col of columns();track col.key){<th scope="col"><button type="button" (click)="sort(col.key)" [attr.aria-sort]="sortKey()===col.key?(sortAsc()?'ascending':'descending'):'none'">{{col.label}} <span aria-hidden="true">{{sortKey()===col.key?(sortAsc()?'↑':'↓'):'↕'}}</span></button></th>}</tr></thead><tbody>@for(row of pageRows();track $index){<tr>@for(col of columns();track col.key){<td>{{row[col.key]}}</td>}</tr>}</tbody></table></div><nav class="rt-pagination" aria-label="Table pagination"><button type="button" [disabled]="page()===0" (click)="page.set(page()-1)">Previous</button><span>Page {{page()+1}} of {{pageCount()}}</span><button type="button" [disabled]="page()+1>=pageCount()" (click)="page.set(page()+1)">Next</button></nav>}
