name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
      - "refactor/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install system ODBC runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends unixodbc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy config

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
        run: python manage.py check

      - name: Guard Django test discovery
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
        run: python scripts/check_test_discovery.py

      - name: Test CI helper scripts
        run: python -m unittest scripts.test_check_tenant_scope scripts.test_summarize_test_failures -v

      - name: Check tenant scope AST guard
        run: python scripts/check_tenant_scope.py

      - name: Unit tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
        run: |
          coverage run --source=apps,config manage.py test
          coverage report --show-missing --fail-under=90

      - name: Check for uncommitted model migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
        run: python manage.py makemigrations --check --dry-run

      - name: Audit production Python dependencies
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Explain frontend CI skip when lockfile is absent
        if: ${{ hashFiles('frontend/package.json') == '' || hashFiles('frontend/package-lock.json') == '' }}
        run: echo "Skipping frontend checks because frontend/package.json or frontend/package-lock.json is missing. Commit the npm lockfile to enable these checks."

      - name: Set up Node.js
        if: ${{ hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != '' }}
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != '' }}
        run: npm run lint --if-present

      - name: Test
        if: ${{ hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != '' }}
        run: npm test -- --watch=false
        env:
          CI: "true"

      - name: Build
        if: ${{ hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != '' }}
        run: npm run build

  backend-sqlserver:
    name: Backend tests on SQL Server
    # Pinned: the ubuntu-latest label is migrating to a newer release than Microsoft's driver repository may support.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci_mssql
      # Throwaway password for a container that only exists for this job.
      DATABASE_PASSWORD: Retailo_CI_Passw0rd!
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Retailo_CI_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Retailo_CI_Passw0rd!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Microsoft ODBC Driver 18
        env:
          ACCEPT_EULA: "Y"
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends unixodbc curl gnupg
          # The runner image may already know Microsoft's repository; only add it if the install fails.
          if ! sudo -E apt-get install --yes --no-install-recommends msodbcsql18; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
            sudo apt-get update
            sudo -E apt-get install --yes --no-install-recommends msodbcsql18
          fi
          odbcinst -q -d

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check the SQL Server connection
        run: python manage.py check --database default

      - name: Unit tests on SQL Server
        # pipefail: the default shell would otherwise report tee's success and hide test failures.
        run: |
          set -o pipefail
          python manage.py test --noinput --verbosity 1 2>&1 | tee test-output.log

      - name: Summarise SQL Server test failures
        if: failure()
        run: python scripts/summarize_test_failures.py test-output.log

  frontend-e2e:
    name: Playwright critical browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Playwright
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Migrate and seed isolated E2E database
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci_e2e
          RETAILO_DEMO_PASSWORD: Retailo-E2E-Password-2026
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo

      - name: Start API and Angular development server
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci_e2e
          RETAILO_DEMO_PASSWORD: Retailo-E2E-Password-2026
        run: |
          cd backend
          python manage.py runserver 0.0.0.0:8000 > /tmp/retailo-api.log 2>&1 &
          cd ../frontend
          npm start -- --proxy-config proxy.conf.json > /tmp/retailo-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null && curl --fail --silent http://127.0.0.1:4200/auth/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/retailo-api.log
          cat /tmp/retailo-frontend.log
          exit 1

      - name: Run Playwright critical flows
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retailo-playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
