name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install system ODBC runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends unixodbc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy config

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
        run: python manage.py check

      - name: Unit tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
        run: python manage.py test

      - name: Check for uncommitted model migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
        run: python manage.py makemigrations --check --dry-run

      - name: Audit production Python dependencies
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test -- --watch=false
        env:
          CI: "true"

      - name: Build
        run: npm run build
