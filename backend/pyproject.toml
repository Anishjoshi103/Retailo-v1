[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Django settings intentionally inherit shared globals from base.py.
[tool.ruff.lint.per-file-ignores]
"config/settings/local.py" = ["F405"]
"config/settings/production.py" = ["F405"]
"config/settings/ci.py" = ["F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.ci"
